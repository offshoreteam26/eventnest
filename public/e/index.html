<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3E0F26">
<title>You're invited</title>
<meta name="description" content="Open your invitation: date, venue, map and RSVP.">
<meta property="og:type" content="website">
<meta property="og:title" content="You're invited 💌">
<meta property="og:description" content="Open your invitation: date, venue, map and RSVP.">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FFF4F6;color:#3F1223;font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
  .spin{width:42px;height:42px;margin:0 auto 14px;border:4px solid #EBC3CD;border-top-color:#8E1F45;border-radius:50%;animation:s 0.9s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  body.nf{display:block;text-align:left;padding:3rem 1.25rem;max-width:30rem;margin:auto;color:#222}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div id="box" role="status"><div class="spin" aria-hidden="true"></div>Opening your invitation…</div>
<noscript><p>Please turn on JavaScript to open the invitation.</p></noscript>
<script type="module" src="/js/invite-page.js"></script>
</body>
</html>
