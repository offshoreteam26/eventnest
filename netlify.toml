# EventNest website (static). Netlify: Base directory = eventnest (if this folder is inside a bigger repo).
[build]
  publish = "public"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

# /e/<join code> = the animated invitation page (one page draws every event).
[[redirects]]
  from = "/e/:code"
  to = "/e/index.html"
  status = 200

# The designs change when you push, so browsers always check for the latest copy.
[[headers]]
  for = "/e/*"
  [headers.values]
    Cache-Control = "no-cache"

# Pictures, music and fonts of the designs rarely change.
[[headers]]
  for = "/w/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
